<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening WhatsApp...</title>
    <script>
      const phoneNumber = "919784104853";
      const whatsappUrl = `https://wa.me/${phoneNumber}`;
      const whatsappAppUrl =
        `intent://send?phone=${phoneNumber}#Intent;scheme=whatsapp;package=com.whatsapp;end`;

      if (/Android/i.test(navigator.userAgent)) {
        window.location.href = whatsappAppUrl;
      } else {
        window.location.replace(whatsappUrl);
      }
    </script>
  </head>
  <body>
    <p>Opening WhatsApp. If it does not open automatically, <a href="intent://send?phone=919784104853#Intent;scheme=whatsapp;package=com.whatsapp;end">tap here to open the chat in WhatsApp</a>.</p>
    <p><a href="https://wa.me/919784104853">Open the chat in your browser</a>.</p>
  </body>
</html>
