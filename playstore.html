<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening Google Play...</title>
    <script>
      const packageName = "a2.morning.ck";
      const playStoreUrl = `https://play.google.com/store/apps/details?id=${packageName}`;

      if (/Android/i.test(navigator.userAgent)) {
        const fallbackUrl = encodeURIComponent(playStoreUrl);
        window.location.replace(
          `intent://details?id=${packageName}#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=${fallbackUrl};end`
        );
      } else {
        window.location.replace(playStoreUrl);
      }
    </script>
  </head>
  <body>
    <p>Opening Google Play. If you are not redirected, <a href="https://play.google.com/store/apps/details?id=a2.morning.ck">tap here to view the app</a>.</p>
  </body>
</html>
